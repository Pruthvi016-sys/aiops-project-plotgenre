# Prometheus scrape configuration - every PlotGenre component is monitored.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway            # API traffic, latency, errors, upstream, genres, live drift
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: frontend           # page loads, UI errors, user actions, proxy calls
    static_configs: [{ targets: ["frontend:8080"] }]
  - job_name: model-server       # deployed version, deployments, rollbacks, health
    static_configs: [{ targets: ["model-server:9102"] }]
  - job_name: pipeline-runner    # pipeline runs, durations, alerts received
    static_configs: [{ targets: ["pipeline-runner:8100"] }]
  - job_name: pushgateway        # per-stage metrics pushed by the DVC stages (throughput, drift)
    honor_labels: true
    static_configs: [{ targets: ["pushgateway:9091"] }]
  - job_name: node               # host CPU / memory / disk
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
